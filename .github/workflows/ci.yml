name: CI
on: [push, pull_request]

jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev,plots]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - run: world-clocker benchmark validate configs/smoke.yaml
