[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "world-clocker"
version = "0.3.0"
description = "A benchmark for accessible behavioral repertoires"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
plots = ["matplotlib>=3.8"]

[project.scripts]
world-clocker = "world_clocker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
world_clocker = ["data/*.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
